[package]
name = "postmark-game"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "postmark_game"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
[dependencies]
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor"] }
